name: ims-v2

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_ENABLE_DEV_ROUTES: ${ENABLE_DEV_ROUTES:-0}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE: /api
      NEXT_PUBLIC_ENABLE_DEV_ROUTES: ${ENABLE_DEV_ROUTES:-0}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # 一次性初始化：API 以非 root（uid 10001）執行，但舊版以 root 建立的 media volume 仍是 root 擁有，
  # 會讓圖片上傳失敗。每次啟動先修正擁有者；已正確時不做任何事。
  media-init:
    build: &api-build
      context: apps/api
      dockerfile: Dockerfile
    user: "0:0"
    command: ["sh", "-c", "find /app/media ! -user 10001 -exec chown 10001:10001 {} +"]
    volumes:
      - media:/app/media
    restart: "no"

  api:
    build: *api-build
    env_file: .env
    environment:
      MEDIA_DIR: /app/media
      # Phase 35：AI 模式（live/stub）；可用 shell 變數覆寫（AI_MODE=stub docker compose up -d api）
      AI_MODE: ${AI_MODE:-live}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*' --no-access-log"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=4).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ims}
      POSTGRES_USER: ${POSTGRES_USER:-ims}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ims_change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ims}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  media:
