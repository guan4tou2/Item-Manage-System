# 前置代理負責 TLS 終結；僅 HTTPS 請求回傳 HSTS。
map $http_x_forwarded_proto $ims_hsts {
    default "";
    https "max-age=31536000; includeSubDomains";
}

upstream web_upstream {
    server web:3000;
}

upstream api_upstream {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 32m;

    # 來源 IP：一律以 nginx 看到的連線位址「覆寫」X-Forwarded-For，不沿用用戶端送來的值。
    # API 的 uvicorn 以 --forwarded-allow-ips='*' 信任此標頭並取最左邊的位址；若用
    # $proxy_add_x_forwarded_for（附加）會讓用戶端自行偽造來源 IP，繞過登入的 IP 節流。
    # 若 nginx 前面還有 TLS 終結的反向代理，請加上（改成該代理的位址）：
    #   set_real_ip_from 10.0.0.0/8;
    #   real_ip_header X-Forwarded-For;
    # 讓 $remote_addr 還原為真實用戶端位址。

    # API
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Next.js (everything else)
    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 安全標頭統一放在 server 層；location 不可另設 add_header，避免覆蓋繼承。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security $ims_hsts always;

    # 既有安全標頭
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
