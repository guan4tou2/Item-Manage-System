[project]
name = "ims-api"
version = "2.0.0a0"
description = "Item Management System v2 API"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]==0.162.6",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.12.5",
    "pydantic-settings==2.11.0",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.30.0",
    "alembic==1.13.3",
    # Phase 44：python-jose → PyJWT、passlib → argon2-cffi（汰換無人維護／有 CVE 的依賴）
    "pyjwt==2.15.1",
    "argon2-cffi==25.1.0",
    "python-multipart==0.0.31",
    "httpx==0.28.1",
    "slowapi==0.1.9",
    "redis==5.1.0",
    "structlog==26.1.0",
    "fastapi-mail==1.6.8",
    "google-genai>=1.0",
    "pywebpush==2.0.0",
    "qrcode[pil]>=7.4",
    # Phase 41：伺服器端標籤 PDF（BSD-3；純 wheel）
    "reportlab==5.1.0",
    # Phase 41：Code128 條碼圖（MIT）
    "python-barcode==0.16.1",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "pytest-asyncio==1.5.0",
    "pytest-cov==5.0.0",
    "aiosqlite==0.20.0",
    # Phase 37：QR 內容真值解碼（wheel，無系統相依）
    "zxing-cpp==3.1.1",
    # Phase 41：PDF raster 後做條碼真值解碼（wheel，無系統 poppler）
    "pypdfium2==5.14.0",
]

[tool.uv]
# 傳遞依賴的漏洞修補下限（pip-audit gate）：由直接依賴帶入但舊鎖定版本有已知 CVE／PYSEC
constraint-dependencies = [
    "starlette>=1.3.1",
    "pillow>=13.0.0",
    "pyasn1>=0.6.5",
    "urllib3>=2.8.0",
    "aiohttp>=3.14.4",
    "aiosmtplib>=5.1.2",
    "anyio>=4.14.2",
    "certifi>=2026.10.18",
    "cryptography>=50.0.0",
    "dnspython>=2.9.0",
    "idna>=3.15",
    "mako>=1.3.12",
    "multidict>=6.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["app"]
