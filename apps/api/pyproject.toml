[project]
name = "ims-api"
version = "2.0.0a0"
description = "Item Management System v2 API"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.30.0",
    "alembic==1.13.3",
    # Phase 44：python-jose → PyJWT、passlib → argon2-cffi（汰換無人維護／有 CVE 的依賴）
    "pyjwt==2.15.1",
    "argon2-cffi==25.1.0",
    "python-multipart==0.0.12",
    "httpx==0.27.2",
    "slowapi==0.1.9",
    "redis==8.1.0",
    "structlog==24.4.0",
    "fastapi-mail==1.4.1",
    "google-genai>=1.0",
    "pywebpush==2.0.0",
    "qrcode[pil]>=7.4",
    # Phase 41：伺服器端標籤 PDF（BSD-3；純 wheel）
    "reportlab==5.1.0",
    # Phase 41：Code128 條碼圖（MIT）
    "python-barcode==0.16.1",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "aiosqlite==0.20.0",
    # Phase 37：QR 內容真值解碼（wheel，無系統相依）
    "zxing-cpp==3.1.1",
    # Phase 41：PDF raster 後做條碼真值解碼（wheel，無系統 poppler）
    "pypdfium2==5.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["app"]
