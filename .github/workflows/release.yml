name: Release

# 只建立 GitHub Release，不建置也不發佈 container image：
# 部署一律從原始碼以 docker compose 建置（Dockerfile 是否建得起來由 CI 的 docker job 把關）。

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  create-release:
    name: 建立 GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 產生發佈說明
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "不支援的版本 tag：$GITHUB_REF_NAME" >&2
            exit 1
          fi
          args=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [[ "$version" == *-* ]]; then
            args+=(--prerelease)
          fi
          # 功能多半直接提交到 main，自動產生的說明只會列出 PR；
          # 先附上 CHANGELOG 中這個版本的段落（找不到就只用自動產生的）。
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > release-notes.md
          if [[ -s release-notes.md ]]; then
            args+=(--notes-file release-notes.md)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}"
